name: Eclipse APK

# Gera o APK do launcher Eclipse Cobblemon.
# - push na main / execução manual: APKs ficam em "Artifacts" na página da execução
# - tag v* (ex.: v1.0.0): também cria um Release com os APKs para os jogadores baixarem
# arm64 = celulares; x86_64 = emuladores no PC (BlueStacks, LDPlayer, Android Studio)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eclipse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        arch: [ arm64, x86_64 ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 não configurado"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ZalithLauncher/eclipse_release.jks

      - name: Build release APK (${{ matrix.arch }})
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ matrix.arch }}

      - name: Remove signing key
        if: always()
        run: rm -f ZalithLauncher/eclipse_release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-cobblemon-apk-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          path: apks
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apks/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Eclipse Cobblemon $GITHUB_REF_NAME" \
            --notes "Launcher Android do servidor Eclipse Cobblemon.

          - Celular: baixe o arquivo que termina em arm64-v8a.apk (Android 8 ou superior, 64 bits)
          - Emulador no PC (BlueStacks, LDPlayer...): baixe o que termina em x86_64.apk

          Versão modificada não oficial do Zalith Launcher 2, distribuída sob a GPL-3.0. O código-fonte desta versão está neste repositório."
