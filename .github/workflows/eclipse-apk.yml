name: Eclipse APK

# Gera o APK do launcher Eclipse Cobblemon.
# - push na main / execução manual: APK fica em "Artifacts" na página da execução
# - tag v* (ex.: v1.0.0): também cria um Release com o APK para os jogadores baixarem

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eclipse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 não configurado"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ZalithLauncher/eclipse_release.jks

      # arm64 cobre praticamente todos os celulares capazes de rodar o modpack
      - name: Build release APK (arm64)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Remove signing key
        if: always()
        run: rm -f ZalithLauncher/eclipse_release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-cobblemon-apk
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ZalithLauncher/build/outputs/apk/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Eclipse Cobblemon $GITHUB_REF_NAME" \
            --notes "Launcher Android do servidor Eclipse Cobblemon. Baixe o arquivo .apk abaixo e instale no celular (Android 8 ou superior, 64 bits).

          Versão modificada não oficial do Zalith Launcher 2, distribuída sob a GPL-3.0. O código-fonte desta versão está neste repositório."
